services:
  db:
    image: postgres:16-alpine
    container_name: reqcore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432" # Postgres — localhost only, never expose publicly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: reqcore_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000" # S3 API — localhost only, never expose publicly
      - "127.0.0.1:9001:9001" # MinIO Console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: reqcore_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Override localhost URLs with Docker-internal hostnames
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backups_data:/data/backups

  # Optional Novu notification infrastructure — run with: docker compose --profile novu up
  novu-mongo:
    image: mongo:7
    container_name: reqcore_novu_mongo
    restart: unless-stopped
    profiles: [novu]
    volumes:
      - novu_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  novu-redis:
    image: redis:7-alpine
    container_name: reqcore_novu_redis
    restart: unless-stopped
    profiles: [novu]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  novu-api:
    image: ghcr.io/novuhq/novu/api:latest
    container_name: reqcore_novu_api
    restart: unless-stopped
    profiles: [novu]
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      NODE_ENV: production
      API_ROOT_URL: http://localhost:3010
      REDIS_HOST: novu-redis
      REDIS_PORT: 6379
      MONGO_URL: mongodb://novu-mongo:27017/novu
      JWT_SECRET: ${NOVU_JWT_SECRET:-novu-dev-secret}
    depends_on:
      novu-redis:
        condition: service_healthy
      novu-mongo:
        condition: service_healthy

  novu-worker:
    image: ghcr.io/novuhq/novu/worker:latest
    container_name: reqcore_novu_worker
    restart: unless-stopped
    profiles: [novu]
    environment:
      NODE_ENV: production
      REDIS_HOST: novu-redis
      REDIS_PORT: 6379
      MONGO_URL: mongodb://novu-mongo:27017/novu
    depends_on:
      novu-redis:
        condition: service_healthy
      novu-mongo:
        condition: service_healthy

  # Optional DB browser — run with: docker compose --profile tools up
  adminer:
    image: adminer
    container_name: reqcore_adminer
    restart: unless-stopped
    profiles: [tools]
    ports:
      - "127.0.0.1:8080:8080" # Adminer → http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  backups_data:
  novu_mongo_data:
